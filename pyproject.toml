[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-code"
version = "0.3.0"
description = "Jarvis-Code - Assistente Virtual Inteligente modular, com memoria, plugins e dashboard remoto"
readme = "readme.md"
requires-python = ">=3.11"
authors = [{name = "Caio S.M."}]
keywords = ["assistente", "jarvis", "ia", "automacao", "qt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "PyQt6>=6.6,<7",
    "sounddevice>=0.4,<1",
    "numpy>=1.24,<3",
    "google-genai>=2.8.0,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Dependencias específicas de SO, ja cobertas por requirements.txt com marcadores:
win = [
    "comtypes",
    "pycaw",
    "win10toast",
    "pywin32",
    "wmi",
    "pywinauto",
]
test = ["pytest>=7,<9"]

[tool.setuptools]
packages = [
    "core",
    "memory",
    "actions",
    "plugins",
    "dashboard",
    "providers",
    "config",
]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = ["-q"]
filterwarnings = ["ignore::DeprecationWarning"]
